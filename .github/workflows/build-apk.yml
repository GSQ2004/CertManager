name: Build Android APK
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install stable Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Verify APK artifact
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat --format='APK bytes: %s' app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK-SHA256SUMS.txt
      - name: Preserve verification reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CertManager-verification-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Publish verified APK to GitHub Releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c APK-SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          apk="CertManager-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "CertManager ${version} 调试预发布版" --generate-notes \
            "$apk" SHA256SUMS.txt
