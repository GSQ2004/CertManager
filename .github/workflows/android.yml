name: Android build
on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    uses: ./.github/workflows/build-apk.yml
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/build-apk.yml
    with:
      publish: true
