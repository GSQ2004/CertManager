name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install stable Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Verify APK artifact
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat --format='APK bytes: %s' app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK-SHA256SUMS.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CertManager-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256SUMS.txt
          if-no-files-found: error
      - name: Preserve verification reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CertManager-verification-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.2.1'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CertManager-debug-apk
      - name: Verify and publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c APK-SHA256SUMS.txt
          cp app/build/outputs/apk/debug/app-debug.apk CertManager-1.2.1-debug.apk
          sha256sum CertManager-1.2.1-debug.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "CertManager 1.2.1 调试预发布版" \
            --notes "改进 PEM 和 DER 单证书校验，支持带 BOM 和 Windows 换行的 PEM。此 APK 使用 CI 调试签名，尚未做真机验证。若签名与旧版不一致，请先导出私有备份再更换安装。" \
            CertManager-1.2.1-debug.apk SHA256SUMS.txt
